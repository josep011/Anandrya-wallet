<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5122E">
<meta name="description" content="Organização financeira da Anandrya: entradas, saídas, orçamento, cofrinhos e extrato em PDF.">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anandrya's Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Anandrya's Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna de celular com cabeçalho fixo, conteúdo rolável, navegação inferior e botão cereja flutuante. */
:root{
  --cherry:#B5122E;
  --cherry-deep:#7E0A20;
  --cherry-bright:#E02347;
  --blush:#FFE6EA;
  --paper:#FFF6F4;
  --ink:#220710;
  --muted:#744651;
  --glass:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  --glass-line:rgba(255,255,255,.75);
  --glass-shadow:0 10px 30px -12px rgba(126,10,32,.28),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(181,18,46,.07);
  --line:#F3D3D9;
  --leaf:#2E7D55;
  --amber:#D98A1F;
  --card:#FFFFFF;
  --display:'Plus Jakarta Sans','Albert Sans',system-ui,sans-serif;
  --body:'Albert Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--cherry-deep);background-image:radial-gradient(60% 50% at 20% 10%,#B5122E 0%,transparent 70%),radial-gradient(50% 40% at 90% 90%,#5A0618 0%,transparent 70%);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--cherry-bright);outline-offset:2px;border-radius:10px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:radial-gradient(70% 38% at 100% 0%,#FFBFCB 0%,transparent 70%),radial-gradient(55% 34% at 0% 42%,#FFD3DB 0%,transparent 72%),radial-gradient(70% 40% at 100% 100%,#FFB8C6 0%,transparent 70%),var(--paper)}
@media(min-width:700px){.app{height:calc(100% - 32px);margin:16px auto;border-radius:36px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55)}}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:21px;color:var(--cherry);letter-spacing:-.01em}
.brand svg{flex:none}
.iconbtn{width:40px;height:40px;border-radius:16px;display:grid;place-items:center;color:var(--cherry);background:rgba(255,255,255,.6);border:1px solid var(--glass-line)}
.iconbtn:active{transform:scale(.94)}
main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(82px + env(safe-area-inset-top)) 16px calc(132px + env(safe-area-inset-bottom));scroll-behavior:smooth}
.view{display:flex;flex-direction:column;gap:16px}
.view>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fillup{from{transform:translateY(var(--h))}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.ic{display:block}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.hello{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--ink)}
.hello small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border-radius:20px;padding:5px}
.monthbar b{font-family:var(--display);font-weight:700;font-size:17px}
.monthbar button{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--cherry)}
.monthbar button:disabled{opacity:.3;cursor:default}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 18px;color:#FFF3F0;background:radial-gradient(110% 80% at 90% 0%,#E02347 0%,transparent 60%),linear-gradient(160deg,#C4132F 0%,#8A0C25 100%);box-shadow:0 22px 34px -18px rgba(126,10,32,.8)}
.hero::before{content:"";position:absolute;left:-20%;top:-55%;width:90%;height:100%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.2),transparent)}
.hero>*{position:relative}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.95}
.hero .big{font-family:var(--display);font-size:46px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px;opacity:.85}
.hero-cherry{position:absolute!important;right:-14px;top:-12px;width:118px;opacity:.13;pointer-events:none;transform:rotate(8deg)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pill-in{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);border-radius:20px;padding:11px 12px;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.pill-in .dot{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.pill-in small{display:block;font-size:11px;opacity:.85;font-weight:600}
.pill-in b{font-size:15px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.card h2{font-size:20px;margin-bottom:12px}
.row-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.row-h h2{margin:0}
.link{color:var(--cherry);font-weight:700;font-size:13px}
.note{display:flex;gap:12px;align-items:center;background:var(--blush);border-radius:20px;padding:12px 14px;font-size:13px;color:var(--cherry-deep)}
.note p{flex:1}
.note button{font-weight:700;color:var(--cherry);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--blush);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E02347,#B5122E);transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.bar.warn i{background:linear-gradient(90deg,#F0B24A,#D98A1F)}
.bar.over i{background:linear-gradient(90deg,#7E0A20,#4A0613)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.perday{margin-top:12px;font-size:13px;color:var(--muted)}
.perday b{color:var(--cherry);font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(0)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.donut .mid small{font-size:11px;color:var(--muted);font-weight:600}
.donut .mid b{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.legend{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.list .tx:first-child{border-top:0}
.cico{--c:#B5122E;width:42px;height:42px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,white)}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{color:var(--muted);font-size:13px;font-weight:500}
.tx .t b{font-weight:650}
.amt-out,.amt-in{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt-in{color:var(--leaf)}
.day{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize;padding:14px 2px 6px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}
.filters{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 12px;height:46px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;height:100%;color:var(--ink)}
.frow{display:flex;gap:10px}
.seg{display:flex;background:var(--blush);border-radius:16px;padding:4px;gap:4px;flex:1}
.seg button{flex:1;height:38px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--cherry-deep)}
.seg button.on{background:var(--card);box-shadow:0 2px 8px -2px rgba(126,10,32,.3);color:var(--cherry)}
select,input[type=date],input[type=text],input[type=number],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;height:46px;padding:0 12px;outline:0}
select{width:auto;max-width:48%;flex:none}
textarea{height:110px;padding:10px 12px;resize:none;font-size:12px}
input:focus,select:focus,textarea:focus{border-color:var(--cherry-bright);box-shadow:0 0 0 3px rgba(224,35,71,.18)}
.brow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.card .brow:first-of-type{border-top:0}
.brow .t{flex:1;min-width:0}
.brow .top2{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}
.brow .top2 b{font-weight:600}
.brow .top2 span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--blush);color:var(--cherry)}
.tag.warn{background:#FFF0D6;color:#9A5F0B}
.tag.over{background:#4A0613;color:#FFD9DF}
.tag.ok{background:#DDF3E7;color:var(--leaf)}
.bigline{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.goal{display:flex;gap:14px;align-items:center}
.gcherry{width:92px;flex:none}
.gcherry .lvl{animation:fillup 1s cubic-bezier(.2,.7,.2,1) both}
.goal .gi{flex:1;min-width:0}
.goal h3{font-size:19px;margin-bottom:2px}
.goal p{font-size:13px;color:var(--muted)}
.goal .nums{font-variant-numeric:tabular-nums;margin:6px 0 8px;font-size:14px}
.goal .nums b{font-size:17px}
.gbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(160deg,#E02347,#B5122E);color:#fff;box-shadow:0 10px 18px -10px rgba(126,10,32,.9)}
.btn.soft{background:var(--blush);color:var(--cherry)}
.btn.ghost{border:1px solid var(--line);color:var(--ink);background:var(--card)}
.btn.danger{color:var(--cherry-deep)}
.btn:active{transform:scale(.97)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:4px}
.stat b{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;display:block}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);fill:var(--muted);font-size:10.5px;font-weight:600}
.chart .sel{font-weight:700;fill:var(--cherry)}
.chart-leg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.chart-leg span{display:flex;align-items:center;gap:6px}
.chart-leg i{width:10px;height:10px;border-radius:3px}
.rank{display:flex;flex-direction:column;gap:12px}
.rank .r1{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;gap:8px}
.rank .r1 span{display:flex;align-items:center;gap:8px}
.rank .r1 i{width:9px;height:9px;border-radius:50%}
.rank .r1 b{font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted)}
nav button .ni{width:44px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav button.on{color:var(--cherry)}
nav button.on .ni{background:rgba(181,18,46,.12)}
.fab{position:absolute;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 32% 28%,#FF6A85 0%,#D4162F 45%,#8A0C25 100%);box-shadow:0 16px 26px -10px rgba(126,10,32,.95),inset 0 -4px 8px rgba(0,0,0,.18);z-index:5;transition:transform .15s}
.fab:active{transform:scale(.92)}
#sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(34,7,16,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .2s}
#sheet.on .scrim{opacity:1}
.panel{position:relative;width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(160deg,rgba(255,250,249,.9),rgba(255,236,240,.82));border:1px solid var(--glass-line);border-bottom:0;box-shadow:0 -20px 50px -20px rgba(126,10,32,.4),inset 0 1px 0 #fff;backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border-radius:30px 30px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheet .28s cubic-bezier(.2,.7,.2,1) both}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:23px}
.x{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--blush);color:var(--cherry)}
.amt{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:6px 0}
.amt span{font-family:var(--display);font-size:26px;color:var(--muted)}
.amt input{width:auto;max-width:220px;border:0;background:none;box-shadow:none!important;height:auto;padding:0;text-align:left;font-family:var(--display);font-size:46px;color:var(--cherry);field-sizing:content;min-width:2ch}
.fld{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.row2{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:#B5122E;display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chip .cico{width:26px;height:26px;border-radius:10px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.actions{display:flex;gap:10px}
.actions .primary{flex:1}
.err{color:var(--cherry);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.help{font-size:13px;color:var(--muted)}
.divider{height:1px;background:var(--line)}
#toast{position:absolute;left:16px;right:16px;bottom:100px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{pointer-events:auto;display:flex;align-items:center;gap:14px;background:rgba(34,7,16,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:rise .3s both}
#toast button{color:#FF8FA3;font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.hello,.hero .big,.bigline,.brand,.amt input,.amt span{font-weight:800;letter-spacing:-.02em}
.hello{font-size:27px}
.hero .big{font-size:40px}
.bigline{font-size:30px}
.brand{font-size:19px}
.amt input{font-size:42px}
.goal h3{font-size:18px}

.tools{display:flex;gap:8px}
.iconbtn.solid{background:linear-gradient(160deg,#E02347,#B5122E);color:#fff;border-color:transparent;box-shadow:0 8px 14px -8px rgba(126,10,32,.9)}
.pair2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.flow{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px 12px}
.flow.in{background:#E4F4EB}
.flow.out{background:var(--blush)}
.flow .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.flow.in .dot{background:var(--leaf)}
.flow.out .dot{background:var(--cherry)}
.flow small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.flow b{display:block;font-variant-numeric:tabular-nums;font-size:15px}
.flow em{font-style:normal;font-size:12px;color:var(--muted)}
.day em{font-style:normal;margin-left:10px;color:var(--muted)}
.day em.up{color:var(--leaf)}
.grp{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 2px -8px}
.grp h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.grp small{display:block;color:var(--muted);font-size:13px}
.grp .gt{text-align:right}
.grp .gt b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.brow .top2 .amt-in{color:var(--leaf);font-weight:700;font-size:14px}

.gi{display:block;overflow:visible}
.gi .gb{fill:var(--gs,#D6102F);stroke:var(--gs,#D6102F);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.gi .gf{fill:var(--gl,#F9BAC6);stroke:rgba(255,255,255,.7);stroke-width:1;stroke-linejoin:round}
.cico{background:linear-gradient(145deg,#FFF6F8,#FFE6EB)!important;color:inherit!important}
.chip .cico{background:transparent!important}
.iconbtn.solid{background:rgba(255,255,255,.6);color:inherit;box-shadow:none;border-color:var(--glass-line)}
nav button .gi{opacity:.5;transition:opacity .2s,transform .2s}
nav button.on .gi{opacity:1;transform:scale(1.1)}
nav button .ni{height:32px}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pk{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}
.pk.on{border-color:var(--cherry);background:#FFF0F3;box-shadow:0 0 0 3px rgba(224,35,71,.16)}
.sug{font-style:normal;font-weight:600;color:var(--cherry);margin-left:6px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin:6px 0 4px;border:1.5px dashed #E7A9B5;border-radius:16px;color:var(--cherry);font-weight:700;background:rgba(255,255,255,.5)}
.chip.add{border-style:dashed;color:var(--cherry);padding:7px 14px}
.btn.sure{background:var(--cherry-deep);color:#fff;border-color:transparent}

.cwrap{position:relative;flex:none;display:block}
.pen{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--cherry);font-style:normal}
.pgs{display:flex;flex-direction:column;gap:14px}
.pg{display:flex;flex-direction:column;gap:8px}
.pg>b{font-size:12.5px;color:var(--muted);font-weight:700}

.gvis{position:relative;flex:none;width:112px}
.gvis.big{width:150px}
.gpig{display:block;width:100%;height:auto}
.gpig .lvl{animation:fillup 1s cubic-bezier(.2,.7,.2,1) both}
.gbadge{position:absolute;right:-4px;top:-4px;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 8px 14px -8px rgba(126,10,32,.5)}
.gnote{font-size:13px;color:var(--muted);margin-top:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--cherry);flex:none}
</style>
</head>

const daysIn=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate();};

/* ---------- estado de tela ---------- */
let V={tab:'home',month:CUR(),q:'',ftype:'all',fcat:'all'};
let undoFn=null,toastT=null;
const NAV=[['home','Início','home'],['tx','Lançamentos','list'],['bud','Orçamento','pie'],['goal','Cofrinhos','pig'],['ana','Análises','bars']];

/* ---------- peças de interface ---------- */
function monthbar(){
  const prevOk=true,nextOk=V.month<CUR();
  return `<div class="monthbar"><button data-a="prev" aria-label="Mês anterior">${ic('left')}</button><b>${monthLabel(V.month)}</b><button data-a="next" aria-label="Próximo mês" ${nextOk?'':'disabled'}>${ic('right')}</button></div>`;
}
function txRow(t){
  const c=ALL[t.cat]||ALL.outros;
  const val=(t.type==='in'?'+ ':'− ')+brl(t.amount);
  return `<button class="tx" data-a="edit" data-id="${t.id}">${cico(t.cat)}<span class="t"><b>${esc(t.desc)}</b><small>${esc(c.n)} · ${esc(t.pay||'Pix')}</small></span><span class="amt-${t.type}">${val}</span></button>`;
}
function donut(entries,total){
  const top=entries.slice(0,6);const rest=entries.slice(6).reduce((s,e)=>s+e[1],0);
  const segs=top.map(([k,v])=>({k,v,c:ALL[k].c,n:ALL[k].n}));
  if(rest>0)segs.push({k:'rest',v:rest,c:'#CDB8BD',n:'Demais'});
  let off=0;
  const arcs=segs.map(s=>{const p=s.v/total*100;const len=Math.max(p-1.2,0.2);const el=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${s.c}" stroke-width="5.2" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${25-off}" stroke-linecap="butt"/>`;off+=p;return el;}).join('');
  return {svg:`<svg viewBox="0 0 42 42" role="img" aria-label="Gastos por categoria"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#FFE6EA" stroke-width="5.2"/>${arcs}</svg>`,segs};
}
function cherryFill(pct,id){
  const p=Math.min(1,Math.max(0,pct));const h=68*p;
  return `<svg class="gcherry" viewBox="0 0 100 112" aria-hidden="true"><defs><clipPath id="cl${id}"><circle cx="50" cy="70" r="34"/></clipPath></defs><path d="M50 38C50 22 58 12 76 8" stroke="#2F6B3E" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M76 8c10-5 20-2 24 6-10 5-20 3-24-6z" fill="#3E8A4F"/><circle cx="50" cy="70" r="34" fill="#FFE0E6"/><g clip-path="url(#cl${id})"><rect class="lvl" style="--h:${h}px" x="10" y="${104-h}" width="80" height="${h+2}" fill="url(#cg)"/></g><circle cx="50" cy="70" r="34" fill="none" stroke="#B5122E" stroke-width="3"/><ellipse cx="38" cy="56" rx="7" ry="4.5" fill="#fff" opacity=".55" transform="rotate(-30 38 56)"/></svg>`;
}

/* ---------- telas ---------- */
function vHome(){
  const T=totals(V.month),bal=T.inc-T.out;
  const h=new Date().getHours();const greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const cats=byCat(V.month);
  const budTotal=Object.values(S.budgets).reduce((a,b)=>a+b,0);
  const spentB=cats.filter(([k])=>S.budgets[k]).reduce((s,[,v])=>s+v,0);
  const pct=budTotal?Math.min(spentB/budTotal,1):0;
  const left=budTotal-spentB;
  const isCur=V.month===CUR();
  const dl=isCur?daysIn(V.month)-new Date().getDate()+1:0;
  const cls=budTotal&&spentB>budTotal?'over':spentB/budTotal>=.8?'warn':'';
  let html='';
  html+=`<div class="hello"><small>${greet}</small>${esc(S.name)}</div>`;
  if(S.demo)html+=`<div class="note"><p>Estes são dados de exemplo para você explorar. Quando quiser, comece com os seus.</p><button data-a="cleardemo">Começar do zero</button></div>`;
  html+=monthbar();
  html+=`<section class="hero"><svg class="hero-cherry" viewBox="0 0 140 120" aria-hidden="true"><path d="M46 62C48 38 62 18 96 8 M96 70C96 44 100 24 96 8" stroke="#2F6B3E" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M96 8c14-6 30-2 38 8-14 6-30 4-38-8z" fill="#3E8A4F"/><circle cx="42" cy="82" r="30" fill="url(#cg)"/><circle cx="98" cy="92" r="26" fill="url(#cg)"/><ellipse cx="32" cy="70" rx="8" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 32 70)"/><ellipse cx="90" cy="82" rx="6.5" ry="4" fill="#fff" opacity=".4" transform="rotate(-30 90 82)"/></svg>
    <div class="lbl">Saldo de ${esc(monthName(V.month))}</div><div class="big">${brl(bal)}</div><div class="sub">Saldo em conta ${brl(overall())}</div>
    <div class="pair"><div class="pill-in"><span class="dot">${ic('up',16,2.2)}</span><span><small>Entradas</small><b>${brl(T.inc)}</b></span></div><div class="pill-in"><span class="dot">${ic('down',16,2.2)}</span><span><small>Saídas</small><b>${brl(T.out)}</b></span></div></div></section>`;
  html+=`<section class="card"><div class="row-h"><h2>Orçamento do mês</h2><button class="link" data-a="tab" data-tab="bud">Ajustar</button></div>`;
  if(budTotal){
    html+=`<div class="bar ${cls}"><i style="width:${(pct*100).toFixed(1)}%"></i></div><div class="meta"><span><b>${brl(spentB)}</b> gastos</span><span>limite <b>${brl(budTotal)}</b></span></div>`;
    html+=`<p class="perday">${left>=0?`Ainda sobram <b>${brl(left)}</b>${isCur&&dl>0?`, ou <b>${brl(left/dl)}</b> por dia até o fim do mês.`:'.'}`:`Você passou <b>${brl(-left)}</b> do limite.`}</p>`;
  }else html+=`<p class="help">Defina limites por categoria para acompanhar quanto ainda pode gastar.</p>`;
  html+=`</section>`;
  html+=`<section class="card"><div class="row-h"><h2>Para onde foi o dinheiro</h2></div>`;
  if(cats.length){
    const d=donut(cats,T.out);
    html+=`<div class="donut-wrap"><div class="donut">${d.svg}<div class="mid"><small>Total</small><b>${brl0(T.out)}</b></div></div><div class="legend">${d.segs.slice(0,5).map(s=>`<div><i style="background:${s.c}"></i><span>${esc(s.n)}</span><b>${Math.round(s.v/T.out*100)}%</b></div>`).join('')}</div></div>`;
  }else html+=`<div class="empty"><b>Nenhum gasto neste mês</b>Registre uma despesa para ver o gráfico.</div>`;
  html+=`</section>`;
  const last=[...T.list].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);
  html+=`<section class="card"><div class="row-h"><h2>Últimos lançamentos</h2><button class="link" data-a="tab" data-tab="tx">Ver todos</button></div>`;
  html+=last.length?`<div class="list">${last.map(txRow).join('')}</div>`:`<div class="empty"><b>Nada por aqui ainda</b>Toque na cereja para registrar o primeiro lançamento.<br><button class="btn primary" data-a="add">${ic('plus')} Novo lançamento</button></div>`;
  html+=`</section>`;
  return html;
}

function txListHtml(){
  let a=monthTx(V.month);
  if(V.ftype!=='all')a=a.filter(t=>t.type===V.ftype);
  if(V.fcat!=='all')a=a.filter(t=>t.cat===V.fcat);
  const q=V.q.trim().toLowerCase();
  if(q)a=a.filter(t=>t.desc.toLowerCase().includes(q)||(ALL[t.cat]||{n:''}).n.toLowerCase().includes(q));
  if(!a.length)return `<div class="empty"><b>Nenhum lançamento encontrado</b>Mude os filtros ou registre um novo.<br><button class="btn primary" data-a="add">${ic('plus')} Novo lançamento</button></div>`;
  a.sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
  const groups={};a.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  const today=ymd(new Date()),yest=ymd(new Date(Date.now()-864e5));
  return Object.keys(groups).map(d=>{
    const g=groups[d];const out=sum(g.filter(t=>t.type==='out')),inn=sum(g.filter(t=>t.type==='in'));
    const lbl=d===today?'Hoje':d===yest?'Ontem':parseD(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'');
    return `<div class="day"><span>${lbl}</span><span>${inn?'<em class="up">+ '+brl(inn)+'</em>':''}${out?'<em>− '+brl(out)+'</em>':''}</span></div><div class="card" style="padding:4px 14px"><div class="list">${g.map(txRow).join('')}</div></div>`;
  }).join('');
}
function vTx(){
  const T=totals(V.month);
  const bal=balanceUpTo(V.month+'-31');
  const nIn=T.list.filter(t=>t.type==='in').length,nOut=T.list.length-nIn;
  const cnt=n=>n+(n===1?' lançamento':' lançamentos');
  const opts=`<option value="all">Todas as categorias</option>`+Object.entries(ALL).map(([k,c])=>`<option value="${k}" ${V.fcat===k?'selected':''}>${esc(c.n)}</option>`).join('');
  return `<div class="hello">Lançamentos<small style="margin:4px 0 0">O que entrou e o que saiu</small></div>${monthbar()}
  <section class="card"><div class="meta" style="margin:0 0 4px"><span>Saldo em conta</span><span>até o fim de ${esc(monthName(V.month))}</span></div><div class="bigline">${brl(bal)}</div>
  <div class="pair2"><div class="flow in"><span class="dot">${ic('up',16,2.2)}</span><span><small>Entrou</small><b>${brl(T.inc)}</b><em>${cnt(nIn)}</em></span></div><div class="flow out"><span class="dot">${ic('down',16,2.2)}</span><span><small>Saiu</small><b>${brl(T.out)}</b><em>${cnt(nOut)}</em></span></div></div></section>
  <div class="filters"><label class="search">${ic('search',18)}<input id="q" type="search" placeholder="Buscar por descrição ou categoria" value="${esc(V.q)}" aria-label="Buscar lançamentos"></label>
  <div class="frow"><div class="seg">${[['all','Todos'],['in','Entradas'],['out','Saídas']].map(([v,l])=>`<button data-a="ftype" data-v="${v}" class="${V.ftype===v?'on':''}">${l}</button>`).join('')}</div><select id="fcat" aria-label="Filtrar por categoria">${opts}</select></div></div>

const cw=k=>`<span class="cwrap">${cico(k)}<i class="pen">${ic('edit',10,2.4)}</i></span>`;
function budRow(k,cats){
  const lim=S.budgets[k],sp=cats[k]||0,c=EXP[k];
  if(lim){const p=sp/lim;const st=p>1?'over':p>=.8?'warn':'';const tag=p>1?'<span class="tag over">Estourou</span>':p>=.8?'<span class="tag warn">Quase no limite</span>':`<span>${Math.round(p*100)}%</span>`;
    return `<button class="brow" data-a="bud" data-cat="${k}">${cw(k)}<span class="t"><span class="top2"><b>${esc(c.n)}</b>${tag}</span><span class="bar ${st}" style="display:block"><i style="width:${Math.min(p,1)*100}%"></i></span><span class="meta" style="margin-top:6px"><span><b>${brl(sp)}</b> de ${brl(lim)}</span><span>${p>1?'+'+brl(sp-lim):brl(lim-sp)+' livres'}</span></span></span></button>`;}
  return `<button class="brow" data-a="bud" data-cat="${k}">${cw(k)}<span class="t"><span class="top2"><b>${esc(c.n)}</b><span class="link">Definir limite</span></span><span class="meta" style="margin:0"><span>${sp?brl(sp)+' gastos neste mês':'Sem gastos neste mês'}</span></span></span></button>`;
}
function groupHtml(title,sub,keys,cats,fixed){
  const sp=keys.reduce((a,k)=>a+(cats[k]||0),0),lim=keys.reduce((a,k)=>a+(S.budgets[k]||0),0);
  return `<div class="grp"><div><h2>${title}</h2><small>${sub}</small></div><div class="gt"><b>${brl0(sp)}</b><small>${lim?'de '+brl0(lim):'sem limite'}</small></div></div><section class="card" style="padding-top:8px;padding-bottom:8px">${keys.map(k=>budRow(k,cats)).join('')||'<div class="empty">Nenhuma categoria aqui.</div>'}<button class="addrow" data-a="cnew" data-kind="out" data-fixed="${fixed?1:0}">${ic('plus',18)} Novo custo ${fixed?'fixo':'variável'}</button></section>`;
}
function vBud(){
  const T=totals(V.month);
  const cats=Object.fromEntries(byCat(V.month));
  const budTotal=Object.values(S.budgets).reduce((a,b)=>a+b,0);
  const spentB=Object.keys(S.budgets).reduce((s,k)=>s+(cats[k]||0),0);
  const pct=budTotal?Math.min(spentB/budTotal,1):0;
  const cls=budTotal&&spentB>budTotal?'over':budTotal&&spentB/budTotal>=.8?'warn':'';
  const sortK=(a,b)=>(S.budgets[b]?1:0)-(S.budgets[a]?1:0)||(cats[b]||0)-(cats[a]||0);
  const fixedKeys=Object.keys(EXP).filter(isFixed).sort(sortK),varKeys=Object.keys(EXP).filter(k=>!isFixed(k)).sort(sortK);
  const insBy={};monthTx(V.month).filter(t=>t.type==='in').forEach(t=>{const o=insBy[t.cat]=insBy[t.cat]||{v:0,d:[]};o.v+=t.amount;if(!o.d.includes(t.desc))o.d.push(t.desc);});
  const insKeys=Object.keys(INC).sort((a,b)=>((insBy[b]||{}).v||0)-((insBy[a]||{}).v||0));
  const insHtml=insKeys.map(k=>{const o=insBy[k];return `<button class="brow" data-a="bud" data-cat="${k}">${cw(k)}<span class="t"><span class="top2"><b>${esc(INC[k].n)}</b>${o?`<span class="amt-in">+ ${brl(o.v)}</span>`:'<span>Sem entradas</span>'}</span><span class="meta" style="margin:0"><span>${o?esc(o.d.slice(0,2).join(', '))+(o.d.length>2?' e mais '+(o.d.length-2):''):'Toque para editar'}</span></span></span></button>`;}).join('');
  return `<div class="hello">Orçamento<small style="margin:4px 0 0">Toque numa categoria para trocar nome, ícone ou limite</small></div>${monthbar()}
  <section class="card"><div class="meta" style="margin:0 0 6px"><span>Gasto nos limites definidos</span></div><div class="bigline">${brl0(spentB)} <span style="font-size:16px;color:var(--muted);font-family:var(--body)">de ${brl0(budTotal)}</span></div><div class="bar ${cls}" style="margin-top:12px"><i style="width:${(pct*100).toFixed(1)}%"></i></div><div class="meta"><span>${budTotal?Math.round(spentB/budTotal*100)+'% usado':'Sem limites ainda'}</span><span>${budTotal?(budTotal-spentB>=0?'sobram <b>'+brl0(budTotal-spentB)+'</b>':'passou <b>'+brl0(spentB-budTotal)+'</b>'):''}</span></div></section>
  <div class="grp"><div><h2>Entradas</h2><small>De onde o dinheiro veio</small></div><div class="gt"><b style="color:var(--leaf)">${brl0(T.inc)}</b><small>no mês</small></div></div>
  <section class="card" style="padding-top:8px;padding-bottom:8px">${insHtml}<button class="addrow" data-a="cnew" data-kind="in">${ic('plus',18)} Nova entrada</button></section>
  ${groupHtml('Custos fixos','Contas que se repetem todo mês',fixedKeys,cats,true)}
  ${groupHtml('Custos variáveis','Gastos que mudam de um mês para o outro',varKeys,cats,false)}`;
}

const GOAL_ICONS=['pig','plane','home','car','cap','laptop','gift','heart','sparkle','ticket','phone','wallet','bank','shield','paw','star','leaf','camera','gamepad','wine'];
const theme=g=>THEMES[g&&g.color]||THEMES.cherry;

  <rect x="14" y="74" width="14" height="14" rx="6" fill="var(--pc)"/><rect x="58" y="74" width="14" height="14" rx="6" fill="var(--pc)"/>
  <path d="M13 46Q3 44 6 34" fill="none" stroke="var(--pc)" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="46" cy="52" rx="34" ry="28" fill="var(--pl)"/>

  <rect x="74" y="42" width="20" height="19" rx="9.5" fill="var(--pc)"/><circle cx="81" cy="51.5" r="1.8" fill="#fff"/><circle cx="88" cy="51.5" r="1.8" fill="#fff"/>
  <circle cx="64" cy="40" r="3.4" fill="#fff" stroke="var(--pc)" stroke-width="1.6"/>
  <ellipse cx="29" cy="40" rx="7" ry="4" fill="#fff" opacity=".55" transform="rotate(-25 29 40)"/>
  <circle cx="42" cy="13" r="7" fill="#fff" stroke="var(--pc)" stroke-width="3"/></svg>${icon&&icon!=='pig'?`<span class="gbadge">${gic(icon,28)}</span>`:''}</div>`;

function goalHtml(g){
  const th=theme(g),p=g.target?g.saved/g.target:0,done=p>=1;
  let extra='';
  if(g.deadline&&!done){
    const now=new Date(),d=parseD(g.deadline);
    const months=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth();
    extra=months>0?`<p class="gnote">Guardando <b style="color:${th.s}">${brl(Math.ceil((g.target-g.saved)/months))}</b> por mês você chega em ${esc(cap(d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.','')))}.</p>`:`<p class="gnote">O prazo chegou. Faltam ${brl(g.target-g.saved)}.</p>`;
  }
  return `<article class="card"><div class="goal">${pigFill(p,g.id,th,g.icon)}<div class="gi"><h3>${esc(g.name)}</h3><div class="nums"><b>${brl(g.saved)}</b> de ${brl(g.target)}</div><div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${th.s}"></i></div><div class="meta" style="margin-top:6px"><span>${Math.round(p*100)}%</span>${done?'<span class="tag ok">Meta batida</span>':`<span>faltam <b>${brl(g.target-g.saved)}</b></span>`}</div></div></div>${extra}<div class="gbtns"><button class="btn primary sm" style="background:${th.s}" data-a="gdep" data-id="${g.id}">${ic('plus',16)} Guardar</button><button class="btn soft sm" data-a="gwith" data-id="${g.id}">Resgatar</button><button class="btn ghost sm" data-a="gedit" data-id="${g.id}" aria-label="Personalizar ${esc(g.name)}">${ic('edit',16)} Personalizar</button></div></article>`;
}
function vGoal(){
  const tot=sum(S.goals.map(g=>({amount:g.saved})));
  return `<div class="hello">Cofrinhos<small style="margin:4px 0 0">Suas reservas, do jeitinho dela</small></div>
  <section class="card"><div class="meta" style="margin:0 0 4px"><span>Guardado em todos os cofrinhos</span></div><div class="bigline">${brl(tot)}</div><div class="meta"><span>${S.goals.length} ${S.goals.length===1?'cofrinho':'cofrinhos'}</span><span>Saldo em conta <b>${brl(overall())}</b></span></div></section>

  <button class="btn primary" data-a="gnew" style="height:50px">${ic('plus')} Novo cofrinho</button>`;

function barChart(){
  const base=parseD(V.month+'-01');const keys=[];
  for(let i=5;i>=0;i--)keys.push(ym(new Date(base.getFullYear(),base.getMonth()-i,1)));
  const data=keys.map(k=>({k,...totals(k)}));
  const max=Math.max(1000,...data.map(d=>Math.max(d.inc,d.out)));
  const step=max>8000?2000:1000;const top=Math.ceil(max/step)*step;
  const W=340,H=184,L=34,B=26,T=10,ch=H-B-T,cw=W-L-4,gw=cw/6,bw=14;
  let g='';
  [0,.5,1].forEach(f=>{const v=top*f,y=T+ch-f*ch;g+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="#F3D3D9" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${compact(v)}</text>`;});
  data.forEach((d,i)=>{
    const cx=L+gw*i+gw/2,sel=d.k===V.month;
    const hi=d.inc/top*ch,ho=d.out/top*ch;
    if(sel)g+=`<rect x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${ch+B-6}" rx="10" fill="#FFE6EA"/>`;
    g+=`<rect x="${cx-bw-1}" y="${T+ch-hi}" width="${bw}" height="${Math.max(hi,0)}" rx="4" fill="#3E9B73"/><rect x="${cx+1}" y="${T+ch-ho}" width="${bw}" height="${Math.max(ho,0)}" rx="4" fill="#B5122E"/><text class="${sel?'sel':''}" x="${cx}" y="${H-8}" text-anchor="middle">${monthShort(d.k)}</text><rect data-a="pickm" data-m="${d.k}" x="${L+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent" style="cursor:pointer"><title>${monthLabel(d.k)}</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas dos últimos 6 meses, em reais">${g}</svg>`;
}
function vAna(){
  const T=totals(V.month);const cats=byCat(V.month);
  const prev=ym(new Date(parseD(V.month+'-01').getFullYear(),parseD(V.month+'-01').getMonth()-1,1));
  const P=totals(prev);
  const days=V.month===CUR()?new Date().getDate():daysIn(V.month);
  const outs=T.list.filter(t=>t.type==='out').sort((a,b)=>b.amount-a.amount);
  const rate=T.inc?Math.round((T.inc-T.out)/T.inc*100):null;
  const delta=P.out?Math.round((T.out-P.out)/P.out*100):null;
  const pays={};T.list.filter(t=>t.type==='out').forEach(t=>{const p=t.pay||'Pix';pays[p]=(pays[p]||0)+t.amount;});
  const payArr=Object.entries(pays).sort((a,b)=>b[1]-a[1]);
  const fx=sum(T.list.filter(t=>t.type==='out'&&isFixed(t.cat))),vr=T.out-fx;
  return `<div class="hello">Análises<small style="margin:4px 0 0">Toque num mês do gráfico para ver os detalhes</small></div>${monthbar()}
  <section class="card"><h2>Últimos 6 meses</h2>${barChart()}<div class="chart-leg"><span><i style="background:#3E9B73"></i>Entradas</span><span><i style="background:#B5122E"></i>Saídas</span><span>valores em R$</span></div></section>
  <div class="stats">
    <div class="stat"><small>Média por dia</small><b>${brl(T.out/Math.max(days,1))}</b><span>em despesas</span></div>
    <div class="stat"><small>Maior gasto</small><b>${outs[0]?brl(outs[0].amount):'—'}</b><span>${outs[0]?esc(outs[0].desc):'Sem despesas'}</span></div>
    <div class="stat"><small>Quanto sobrou da renda</small><b>${rate===null?'—':rate+'%'}</b><span>${rate===null?'Sem receitas':rate>=0?'do que entrou':'gastou mais que recebeu'}</span></div>
    <div class="stat"><small>Contra o mês anterior</small><b>${delta===null?'—':(delta>0?'+':'')+delta+'%'}</b><span>${delta===null?'Sem dados':delta>0?'gastou mais':delta<0?'gastou menos':'igual'}</span></div>
  </div>
  <section class="card"><h2>Fixos e variáveis</h2>${T.out?`<div class="stack"><i style="width:${fx/T.out*100}%;background:#7E0A20"></i><i style="width:${vr/T.out*100}%;background:#E8647C"></i></div><div class="legend" style="margin-top:12px"><div><i style="background:#7E0A20"></i><span>Custos fixos</span><b>${brl(fx)}</b></div><div><i style="background:#E8647C"></i><span>Custos variáveis</span><b>${brl(vr)}</b></div></div>`:'<div class="empty">Sem despesas neste mês.</div>'}</section>
  <section class="card"><h2>Por categoria</h2>${cats.length?`<div class="rank">${cats.map(([k,v])=>`<div><div class="r1"><span><i style="background:${ALL[k].c}"></i>${esc(ALL[k].n)}</span><b>${brl(v)} · ${Math.round(v/T.out*100)}%</b></div><div class="bar"><i style="width:${v/cats[0][1]*100}%;background:${ALL[k].c}"></i></div></div>`).join('')}</div>`:`<div class="empty">Sem despesas neste mês.</div>`}</section>
  <section class="card"><h2>Como você pagou</h2>${payArr.length?`<div class="stack">${payArr.map(([p,v])=>`<i style="width:${v/T.out*100}%;background:${PAYC[p]||'#A98A92'}"></i>`).join('')}</div><div class="legend" style="margin-top:12px">${payArr.map(([p,v])=>`<div><i style="background:${PAYC[p]||'#A98A92'}"></i><span>${esc(p)}</span><b>${brl(v)}</b></div>`).join('')}</div>`:`<div class="empty">Sem despesas neste mês.</div>`}</section>`;
}

/* ---------- extrato em PDF ---------- */
const fmtBR=d=>d.split('-').reverse().join('/');
const lastDay=k=>k+'-'+pad(daysIn(k));
function periodLabel(from,to){
  const k=from.slice(0,7);
  if(k===to.slice(0,7)&&from.endsWith('-01')&&to===lastDay(k))return monthLabel(k);
  return fmtBR(from)+' a '+fmtBR(to);
}
function buildStatement(from,to){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  const PW=210,PH=297,M=14,CW=PW-2*M;
  const C={cherry:[181,18,46],deep:[126,10,32],blush:[255,230,234],ink:[34,7,16],muted:[116,70,81],line:[243,211,217],leaf:[46,125,85],paper:[255,246,244],white:[255,255,255],pink:[255,214,222]};
  const clean=v=>String(v).replace(/[^ -~¡-ÿ]/g,'').replace(/\s+/g,' ');
  const money=n=>clean(brl(Math.abs(n)));
  const sgn=n=>(n<0?'- ':'')+money(n);
  const fill=c=>doc.setFillColor(c[0],c[1],c[2]),ink=c=>doc.setTextColor(c[0],c[1],c[2]),stroke=c=>doc.setDrawColor(c[0],c[1],c[2]);
  const font=(b,z)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(z);};
  const text=(v,x,y,o)=>doc.text(clean(v),x,y,o);
  const fit=(v,w)=>{v=clean(v);if(doc.getTextWidth(v)<=w)return v;while(v.length>1&&doc.getTextWidth(v+'...')>w)v=v.slice(0,-1);return v+'...';};
  const label=periodLabel(from,to);
  const txs=S.tx.filter(t=>t.date>=from&&t.date<=to).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  const ins=txs.filter(t=>t.type==='in'),outs=txs.filter(t=>t.type==='out');
  const tIn=sum(ins),tOut=sum(outs);
  const pd=parseD(from);
  const before=balanceUpTo(ymd(new Date(pd.getFullYear(),pd.getMonth(),pd.getDate()-1)));
  const after=balanceUpTo(to);
  const now=new Date();
  const issued=ymd(now).split('-').reverse().join('/')+' às '+pad(now.getHours())+':'+pad(now.getMinutes());
  const num='EXT-'+from.replace(/-/g,'')+'-'+to.replace(/-/g,'');

  /* cabeçalho */
  fill(C.cherry);doc.rect(0,0,PW,46,'F');
  try{doc.setGState(new doc.GState({opacity:.14}));fill(C.white);doc.circle(168,40,26,'F');doc.circle(198,48,20,'F');doc.setGState(new doc.GState({opacity:1}));}catch(e){}
  doc.setLineWidth(.5);stroke(C.white);doc.line(M+4.5,17,M+8,8.5);doc.line(M+11.5,18.5,M+8,8.5);
  fill(C.pink);doc.circle(M+4.5,19,3.6,'F');doc.circle(M+11.5,20.5,3.1,'F');
  fill([140,214,160]);doc.ellipse(M+11,8.2,3,1.4,'F');
  font(true,17);ink(C.white);text("Anandrya's Wallet",M+19,17);
  font(false,8.5);ink(C.pink);text('Extrato de movimentações',M+19,23);
  font(true,7);ink(C.pink);text('TITULAR',M,34);
  font(true,11);ink(C.white);text(S.name,M,40);
  font(true,7.5);ink(C.pink);text('EXTRATO',PW-M,11,{align:'right'});
  font(true,15);ink(C.white);text(label,PW-M,19,{align:'right'});
  font(false,8);ink(C.pink);
  text('Período: '+fmtBR(from)+' a '+fmtBR(to),PW-M,27,{align:'right'});
  text('Emitido em '+issued,PW-M,33,{align:'right'});
  text('Nº '+num,PW-M,39,{align:'right'});

  /* resumo */
  let y=54;
  fill(C.blush);doc.roundedRect(M,y,CW,30,4,4,'F');
  const colW=CW/4;
  [['Saldo anterior',sgn(before),C.ink],['Entradas','+ '+money(tIn),C.leaf],['Saídas','- '+money(tOut),C.cherry]].forEach((it,i)=>{
    const x=M+6+colW*i;font(true,7);ink(C.muted);text(it[0].toUpperCase(),x,y+10);font(true,12.5);ink(it[2]);text(it[1],x,y+19);
  });
  const rx=M+CW-colW-1;
  fill(C.cherry);doc.roundedRect(rx,y+3,colW-3,24,3.5,3.5,'F');
  font(true,7);ink(C.pink);text('SALDO EM CONTA',rx+5,y+10);
  font(true,12.5);ink(C.white);text(sgn(after),rx+5,y+18.5);
  font(false,7);ink(C.pink);text('em '+fmtBR(to),rx+5,y+23.5);
  y+=40;

  const newPage=()=>{doc.addPage();fill(C.cherry);doc.rect(0,0,PW,10,'F');font(true,8);ink(C.white);text("Anandrya's Wallet",M,6.6);font(false,8);ink(C.pink);text('Extrato · '+label,PW-M,6.6,{align:'right'});y=20;};
  const ensure=h=>{if(y+h>PH-20)newPage();};
  const section=(title,sub,total,color)=>{
    ensure(24);font(true,13);ink(C.ink);text(title,M,y);
    if(total){ink(color);text(total,PW-M,y,{align:'right'});}
    if(sub){font(false,8);ink(C.muted);text(sub,M,y+5);}
    stroke(C.line);doc.setLineWidth(.3);doc.line(M,y+8,PW-M,y+8);stroke(color||C.cherry);doc.setLineWidth(.8);doc.line(M,y+8,M+22,y+8);
    y+=14;
  };
  const sub=(title,note,total,color)=>{
    ensure(22);fill(color);doc.roundedRect(M,y-3.4,1.8,5.2,.9,.9,'F');font(true,10);ink(C.ink);text(title,M+4,y);
    font(false,8);ink(C.muted);text(note,M+4+doc.getTextWidth(clean(title))+3,y);
    font(true,10);ink(C.ink);text(total,PW-M,y,{align:'right'});y+=6;
  };
  const cols=[{h:'Data',x:M+2},{h:'Descrição',x:M+20,w:62},{h:'Categoria',x:M+84,w:36},{h:'Pagamento',x:M+122,w:22},{h:'Valor',x:M+CW-2,r:true}];
  const head=()=>{fill(C.blush);doc.roundedRect(M,y,CW,6.6,1.6,1.6,'F');font(true,7);ink(C.muted);cols.forEach(c=>text(c.h.toUpperCase(),c.x,y+4.4,c.r?{align:'right'}:undefined));y+=8.4;};
  const rows=(list,sign)=>{
    if(!list.length){font(false,9);ink(C.muted);text('Nenhum lançamento neste grupo.',M+2,y+3);y+=11;return;}
    ensure(18);head();
    list.forEach((t,i)=>{
      if(y+7.4>PH-20){newPage();head();}
      if(i%2===1){fill(C.paper);doc.rect(M,y-1.2,CW,7.2,'F');}
      font(false,8.5);ink(C.muted);text(t.date.slice(8)+'/'+t.date.slice(5,7),cols[0].x,y+3.4);
      font(true,8.8);ink(C.ink);text(fit(t.desc,cols[1].w-2),cols[1].x,y+3.4);
      font(false,8.5);ink(C.muted);text(fit((ALL[t.cat]||ALL.outros).n,cols[2].w-2),cols[2].x,y+3.4);text(fit(t.pay||'Pix',cols[3].w-2),cols[3].x,y+3.4);
      font(true,9);ink(sign>0?C.leaf:C.ink);text((sign>0?'+ ':'- ')+money(t.amount),cols[4].x,y+3.4,{align:'right'});
      y+=7;
    });
    y+=5;
  };

  /* entradas */
  section('Entradas','O que entrou no período · '+ins.length+(ins.length===1?' lançamento':' lançamentos'),'+ '+money(tIn),C.leaf);
  rows(ins,1);

  /* saídas */
  const fxOuts=outs.filter(t=>isFixed(t.cat)),vrOuts=outs.filter(t=>!isFixed(t.cat));
  section('Saídas','Tudo o que saiu, separado em custos fixos e variáveis','- '+money(tOut),C.cherry);
  sub('Custos fixos','contas que se repetem todo mês',money(sum(fxOuts)),C.deep);
  rows(fxOuts,-1);
  sub('Custos variáveis','gastos que mudam de um mês para o outro',money(sum(vrOuts)),[232,100,124]);
  rows(vrOuts,-1);

  /* resumo por categoria */
  const byC={};outs.forEach(t=>{byC[t.cat]=(byC[t.cat]||0)+t.amount;});
  const oneMonth=from.slice(0,7)===to.slice(0,7);
  const keys=Object.keys(EXP).filter(k=>byC[k]||(oneMonth&&S.budgets[k])).sort((a,b)=>(isFixed(b)?1:0)-(isFixed(a)?1:0)||(byC[b]||0)-(byC[a]||0));
  if(keys.length){
    section('Resumo por categoria',oneMonth?'Gasto no período contra o limite mensal':'Gasto no período',null,C.cherry);
    ensure(16);
    fill(C.blush);doc.roundedRect(M,y,CW,6.6,1.6,1.6,'F');font(true,7);ink(C.muted);
    text('CATEGORIA',M+2,y+4.4);text('TIPO',M+64,y+4.4);text('GASTO',M+108,y+4.4,{align:'right'});text('LIMITE',M+136,y+4.4,{align:'right'});text('USO',M+CW-2,y+4.4,{align:'right'});y+=8.4;
    keys.forEach((k,i)=>{
      if(y+7.4>PH-20){newPage();}
      if(i%2===1){fill(C.paper);doc.rect(M,y-1.2,CW,7.2,'F');}
      const lim=oneMonth?S.budgets[k]:0,sp=byC[k]||0;
      font(true,8.8);ink(C.ink);text(EXP[k].n,M+2,y+3.4);
      font(false,8.5);ink(C.muted);text(isFixed(k)?'Fixo':'Variável',M+64,y+3.4);
      font(true,8.8);ink(C.ink);text(money(sp),M+108,y+3.4,{align:'right'});
      font(false,8.5);ink(C.muted);text(lim?money(lim):'-',M+136,y+3.4,{align:'right'});
      if(lim){const p=sp/lim;fill(C.blush);doc.roundedRect(M+CW-34,y+1.2,18,2.2,1.1,1.1,'F');fill(p>1?C.deep:p>=.8?[217,138,31]:C.cherry);doc.roundedRect(M+CW-34,y+1.2,Math.max(1.5,18*Math.min(p,1)),2.2,1.1,1.1,'F');font(true,8);ink(p>1?C.cherry:C.muted);text(Math.round(p*100)+'%',M+CW-2,y+3.4,{align:'right'});}
      else{font(false,8.5);ink(C.muted);text('-',M+CW-2,y+3.4,{align:'right'});}
      y+=7;
    });
    y+=6;
  }

  /* fechamento */
  ensure(46);
  fill(C.blush);doc.roundedRect(M,y,CW,38,4,4,'F');
  font(true,10);ink(C.ink);text('Fechamento do período',M+6,y+8);
  const line=(lbl,val,yy,bold,col)=>{font(bold,9.5);ink(bold?C.ink:C.muted);text(lbl,M+6,yy);font(true,9.5);ink(col||C.ink);text(val,M+CW-6,yy,{align:'right'});};
  line('Saldo anterior em '+fmtBR(from),sgn(before),y+15);
  line('(+) Entradas','+ '+money(tIn),y+21,false,C.leaf);
  line('(-) Saídas','- '+money(tOut),y+27,false,C.cherry);
  stroke(C.cherry);doc.setLineWidth(.4);doc.line(M+6,y+29.5,M+CW-6,y+29.5);
  line('(=) Saldo em conta em '+fmtBR(to),sgn(after),y+35,true,C.cherry);
  y+=46;
  ensure(10);font(false,7.5);ink(C.muted);
  text("Extrato gerado pelo Anandrya's Wallet com os lançamentos registrados no app. Valores em reais (BRL).",M,y);

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);stroke(C.line);doc.setLineWidth(.3);doc.line(M,PH-14,PW-M,PH-14);font(false,7.5);ink(C.muted);text("Anandrya's Wallet · Extrato de "+label,M,PH-9);text('Página '+i+' de '+n,PW-M,PH-9,{align:'right'});}
  return doc;
}
async function savePdf(filename,buf){
  const blob=new Blob([buf],{type:'application/pdf'});
  const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
  if(dl){await dl.save({filename,data:blob});return 'saved';}
  try{const file=new File([blob],filename,{type:'application/pdf'});if(window.matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Extrato'});return 'shared';}}catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  return 'fallback';
}
function statementSheet(){
  const mk=V.month,cur=CUR(),today=ymd(new Date());
  const f0=mk+'-01',t0=mk===cur?today:lastDay(mk);
  const nw=new Date(),pm=ym(new Date(nw.getFullYear(),nw.getMonth()-1,1));
  openSheet(`${head('Extrato')}
  <p class="help">Gera um PDF no estilo de uma fatura, com tudo que entrou e saiu no período escolhido.</p>
  <div class="chips" id="x-quick"><button type="button" class="chip" style="padding:8px 14px" data-q="cur">Este mês</button><button type="button" class="chip" style="padding:8px 14px" data-q="prev">Mês passado</button><button type="button" class="chip" style="padding:8px 14px" data-q="30">Últimos 30 dias</button></div>
  <div class="row2"><label class="fld"><span>De</span><input id="x-from" type="date" value="${f0}"></label><label class="fld"><span>Até</span><input id="x-to" type="date" value="${t0}"></label></div>
  <div class="card" id="x-prev" style="padding:14px"></div>
  <p class="err" id="x-err" role="alert"></p>
  <button class="btn primary" id="x-go" style="height:50px">${ic('doc')} Gerar extrato em PDF</button>`,()=>{
    const upd=()=>{
      const f=$('#x-from').value,t=$('#x-to').value;
      if(!f||!t||f>t){$('#x-prev').innerHTML='<span class="help">Escolha um período válido.</span>';return;}
      const a=S.tx.filter(x=>x.date>=f&&x.date<=t);
      const i=sum(a.filter(x=>x.type==='in')),o=sum(a.filter(x=>x.type==='out'));
      $('#x-prev').innerHTML=a.length?`<div class="meta" style="margin:0 0 8px"><span>${esc(periodLabel(f,t))}</span><span>${a.length} ${a.length===1?'lançamento':'lançamentos'}</span></div><div class="pair2" style="margin:0"><div class="flow in"><span><small>Entrou</small><b>${brl(i)}</b></span></div><div class="flow out"><span><small>Saiu</small><b>${brl(o)}</b></span></div></div>`:'<span class="help">Nenhum lançamento nesse período. O extrato sai só com o saldo.</span>';
    };
    upd();
    $('#x-from').addEventListener('input',upd);$('#x-to').addEventListener('input',upd);
    $('#x-quick').addEventListener('click',e=>{
      const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q;let f,t;
      if(q==='cur'){f=cur+'-01';t=today;}
      else if(q==='prev'){f=pm+'-01';t=lastDay(pm);}
      else{const d=new Date();d.setDate(d.getDate()-29);f=ymd(d);t=today;}
      $('#x-from').value=f;$('#x-to').value=t;upd();
    });
    $('#x-go').addEventListener('click',async()=>{
      const from=$('#x-from').value,to=$('#x-to').value,err=$('#x-err');err.textContent='';
      if(!from||!to){err.textContent='Escolha as duas datas.';return;}
      if(from>to){err.textContent='A data inicial precisa ser antes da final.';return;}
      if(!(window.jspdf&&window.jspdf.jsPDF)){err.textContent='Não consegui carregar o gerador de PDF. Confira a internet e tente de novo.';return;}
      const btn=$('#x-go');btn.disabled=true;btn.textContent='Gerando...';
      try{
        const doc=buildStatement(from,to);
        const buf=doc.output('arraybuffer');
        const k=from.slice(0,7);
        const name='extrato-anandrya-'+((k===to.slice(0,7)&&from.endsWith('-01')&&to===lastDay(k))?k:from+'-a-'+to)+'.pdf';
        const r=await savePdf(name,buf);
        closeSheet();toast(r==='saved'?'Extrato salvo':'Extrato gerado');
      }catch(e){
        btn.disabled=false;btn.innerHTML=ic('doc')+' Gerar extrato em PDF';
        err.textContent=(e&&e.code==='declined')?'Download cancelado. Toque em gerar de novo quando quiser.':'Não deu para salvar o PDF aqui. Tente de novo ou abra o app pelo navegador.';
      }
    });
  });
}

/* ---------- eventos ---------- */
function shift(d){const b=parseD(V.month+'-01');const n=ym(new Date(b.getFullYear(),b.getMonth()+d,1));if(n>CUR())return;V.month=n;render();}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  const A={
    tab:()=>{V.tab=el.dataset.tab;render();$('#view').scrollTop=0;},
    prev:()=>shift(-1),next:()=>shift(1),
    add:()=>txSheet(),edit:()=>txSheet(id),close:closeSheet,gear:settingsSheet,extrato:()=>statementSheet(),gocat:()=>{V.tab='tx';V.fcat=el.dataset.cat;V.ftype=el.dataset.t;V.q='';render();$('#view').scrollTop=0;},
    bud:()=>catSheet({id:el.dataset.cat}),cnew:()=>catSheet({kind:el.dataset.kind,fixed:el.dataset.fixed==='1'}),
    gnew:()=>goalSheet(),gedit:()=>goalSheet(id),gdep:()=>moneySheet(id,'dep'),gwith:()=>moneySheet(id,'with'),
    pickm:()=>{V.month=el.dataset.m;render();},
    ftype:()=>{V.ftype=el.dataset.v;render();},
    cleardemo:()=>{const nm=S.name;S=blank();S.name=nm;ensureCats();save();render();toast('Tudo limpo. Pode começar');},
    undo:()=>{if(undoFn){undoFn();undoFn=null;$('#toast').innerHTML='';}}
  };
  if(A[a])A[a]();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;$('#txlist').innerHTML=txListHtml();}});
document.addEventListener('change',e=>{if(e.target.id==='fcat'){V.fcat=e.target.value;$('#txlist').innerHTML=txListHtml();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

$('#gearbtn').innerHTML=gic('toggle',28);
$('#xbtn').innerHTML=gic('doc',28);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
$('#fab').innerHTML=ic('plus',30,2.4);
render();
</script>
